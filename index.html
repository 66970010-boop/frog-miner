<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="奶蛙工厂——od厂长的邪恶罐头工厂，蛋蛋帮他抓遍天下奶蛙！">
<title>奶蛙工厂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='34' r='26' fill='%23ffd93d'/><circle cx='22' cy='30' r='6' fill='%23222'/><circle cx='42' cy='30' r='6' fill='%23222'/><circle cx='22' cy='30' r='2.4' fill='%23fff'/><circle cx='42' cy='30' r='2.4' fill='%23fff'/><path d='M20 46 Q32 56 44 46' stroke='%23a9742f' stroke-width='4' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
:root{--gold:#ffd75e;--gold2:#f5a623;--soil:#7a4a21;--soil2:#5c3618;--wood:#6b4226;--brown:#3a2410;--green:#58a84f;--cream:#fdf6e3;--evil:#d94b3a;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:linear-gradient(180deg,#1a0f08 0%,#3a2010 55%,#1a0f08 100%);font-family:'ZCOOL KuaiLe','Microsoft YaHei','PingFang SC',sans-serif;color:var(--cream);display:flex;align-items:center;justify-content:center;padding:12px;min-height:100vh;}
.page{width:100%;max-width:860px;}
.hud{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;background:linear-gradient(180deg,#8a5a2b,#6b3f18);border:4px solid var(--brown);border-bottom:none;border-radius:14px 14px 0 0;padding:8px 14px;box-shadow:inset 0 2px 0 rgba(255,215,94,.22);}
.hgroup{display:flex;gap:16px;}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.05;min-width:52px;}
.stat span{font-size:12px;color:#ffd98a;letter-spacing:3px;}
.stat b{font-size:20px;color:#fff2c4;text-shadow:0 2px 0 rgba(0,0,0,.35);}
.stat.warn b{color:#ff6b5e;animation:blink .5s steps(1) infinite;}
@keyframes blink{50%{opacity:.35}}
.hbtn{font-family:inherit;background:linear-gradient(180deg,#ffd75e,#f0a120);color:#4a2c0f;border:3px solid var(--brown);border-radius:10px;padding:5px 14px;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--brown);white-space:nowrap;}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brown);}
.iconbtn{background:linear-gradient(180deg,#ffd75e,#f0a120);border:3px solid var(--brown);border-radius:10px;width:38px;height:36px;cursor:pointer;box-shadow:0 3px 0 var(--brown);display:flex;align-items:center;justify-content:center;color:#4a2c0f;}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brown);}
.iconbtn svg{width:20px;height:20px;}
.stage{position:relative;border:4px solid var(--brown);border-top:none;border-radius:0 0 16px 16px;background:#5c3618;box-shadow:0 14px 34px rgba(0,0,0,.5);}
canvas{display:block;width:100%;height:auto;border-radius:0 0 12px 12px;touch-action:none;}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(22,11,3,.56);border-radius:0 0 12px 12px;z-index:5;padding:12px;}
.hidden{display:none!important;}
.card{background:linear-gradient(180deg,#8a5a2b,#6b3f18);border:3px solid var(--brown);border-radius:18px;padding:20px 26px;text-align:center;max-width:92%;max-height:96%;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.5);}
h1{font-size:34px;color:#ffe14d;text-shadow:0 3px 0 #7a4a21,0 7px 0 rgba(0,0,0,.28);line-height:1.12;letter-spacing:2px;}
.factoryTitle{font-size:44px;margin-bottom:6px;color:#ffe14d;text-shadow:0 4px 0 #7a4a21,0 8px 0 rgba(0,0,0,.4);letter-spacing:8px;margin-bottom:8px;}
.factoryScreen{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 50%,#3a2410 0%,#120803 70%);z-index:5;overflow:hidden;}
.factoryLeft{position:absolute;left:6%;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;align-items:flex-start;gap:18px;}
.factoryOd{position:absolute;right:0;bottom:0;height:96%;z-index:1;filter:drop-shadow(0 12px 16px rgba(0,0,0,.5));}
.frogBtn{position:relative;cursor:pointer;width:200px;height:200px;display:flex;align-items:center;justify-content:center;transition:transform .15s;filter:drop-shadow(0 0 24px rgba(255,225,77,.8)) drop-shadow(0 0 48px rgba(255,157,61,.5));}
.frogBtn:hover{transform:scale(1.08);}
.frogBtn img{width:100%;height:100%;object-fit:contain;animation:floatFrog 2.4s ease-in-out infinite;}
.difficultyBar{display:flex;gap:8px;margin-top:10px;justify-content:center;}
.diffBtn{padding:6px 16px;font-size:14px;background:#e8c878;color:#5a3818;border:2px solid #a06810;border-radius:8px;cursor:pointer;font-family:inherit;}
.diffBtn.active{background:#ffd75e;box-shadow:0 0 12px rgba(255,215,94,.7);font-weight:bold;}
.frogBtnLabel{position:absolute;bottom:18%;left:0;right:0;text-align:center;font-size:26px;color:#4a2c0f;letter-spacing:3px;text-shadow:0 2px 0 rgba(255,255,255,.6);font-weight:bold;pointer-events:none;}
@keyframes floatFrog{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.factorySub{display:flex;gap:10px;margin-top:6px;}
.frogs{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:10px 0 6px;}
.frogs img{width:72px;height:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4));animation:bob 2.2s ease-in-out infinite;}
.frogs img:nth-child(2){width:52px;animation-delay:.6s;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.laughBox{width:162px;height:216px;margin:10px auto 4px;background-image:url('assets/laugh-sheet2.webp');background-size:3240px 216px;animation:laughplay 1.8s steps(20) infinite;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4));}
@keyframes laughplay{from{background-position:0 0}to{background-position:-3240px 0}}
.dexGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto 6px;max-width:440px;}
.dexCell{background:rgba(0,0,0,.22);border:2px solid #7a4a21;border-radius:12px;padding:8px 4px 6px;text-align:center;}
.dexCell img{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));}
.dexCell .nm{font-size:13px;color:#ffe9b8;margin-top:4px;line-height:1.2;}
.dexCell.locked img{filter:grayscale(1) brightness(.45);}
.dexCell.locked .nm{color:#9c8661;}
.rules{list-style:none;text-align:left;font-size:14px;color:#ffefc9;margin:10px auto 14px;max-width:330px;line-height:1.75;}
.rules li::before{content:'· ';color:#ffe14d;font-weight:bold;}
.bigbtn{font-family:inherit;font-size:22px;letter-spacing:4px;color:#4a2c0f;background:linear-gradient(180deg,#ffe14d,#f5a623);border:3px solid #7a4a21;border-radius:14px;padding:11px 38px;cursor:pointer;box-shadow:0 5px 0 #7a4a21;transition:transform .06s;width:100%;}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #7a4a21;}
.bigbtn:hover{filter:brightness(1.06);}
.bigbtn.evil{background:linear-gradient(180deg,#ff9d8a,#d94b3a);color:#fff;border-color:#7a1a10;}
.row{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.smallbtn{font-family:inherit;font-size:17px;color:#4a2c0f;background:linear-gradient(180deg,#ffe9a0,#f5a623);border:3px solid #7a4a21;border-radius:12px;padding:9px 22px;cursor:pointer;box-shadow:0 4px 0 #7a4a21;}
.smallbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4a21;}
.sub{font-size:14px;color:#ffe9b8;margin-top:8px;}
.hint{text-align:center;font-size:13px;color:#cbb489;margin-top:10px;line-height:1.7;}
.kbd{background:#6b4226;border:1px solid #3a2410;border-bottom-width:3px;border-radius:5px;padding:1px 7px;font-family:inherit;font-size:12px;color:#ffe9b8;}
.loadingBox{text-align:center;color:#ffe14d;font-size:22px;letter-spacing:4px;}
.loadingDot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ffe14d;margin:14px 4px 0;animation:bounce 1s infinite ease-in-out;}
.loadingDot:nth-child(2){animation-delay:.15s}
.loadingDot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.introScreen{position:absolute;inset:0;background:#1a0f08;border-radius:0 0 12px 12px;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
.introScene{font-size:28px;color:#ffe14d;text-align:center;padding:20px;line-height:1.5;max-width:700px;}
.introArrow{position:absolute;bottom:20px;right:30px;color:#ffe14d;font-size:20px;animation:blink 1s infinite;}
.introImg{max-width:180px;max-height:160px;margin:10px auto;display:block;}
.rareShow{position:absolute;inset:0;background:rgba(0,0,0,.85);border-radius:0 0 12px 12px;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rareShow .rareImg{width:200px;height:200px;object-fit:contain;filter:drop-shadow(0 0 30px rgba(255,215,94,.8));animation:rarePop .6s cubic-bezier(.2,1.6,.4,1);}
.rareShow .rareLabel{font-size:32px;color:#ffe14d;margin-top:16px;text-shadow:0 3px 0 #7a4a21;}
.rareShow .rareTag{font-size:16px;color:#ff9d3d;margin-top:6px;letter-spacing:4px;}
@keyframes rarePop{0%{transform:scale(0) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
@media(max-width:560px){
  .page{max-width:100%;}
  h1{font-size:22px;}
  .factoryTitle{font-size:26px;letter-spacing:3px;}
  .factoryOd{height:38%;right:-5%;opacity:.35;}
  .factoryLeft{left:4%;top:42%;gap:8px;align-items:center;}
  .factoryTitle{font-size:22px !important;letter-spacing:2px !important;margin-bottom:0 !important;}
  .frogBtn{width:100px !important;height:100px !important;}
  .frogBtnLabel{font-size:14px !important;bottom:12% !important;}
  .factorySub{gap:4px;}
  .smallbtn{font-size:11px;padding:3px 8px;}
  .difficultyBar{margin-top:2px;}
  .diffBtn{padding:3px 8px;font-size:11px;}
  .frogBtn{width:130px;height:130px;}
  .frogBtnLabel{font-size:18px;}
  .goldStart{width:160px;height:120px;}
  .goldStart .label{font-size:20px;}
  .hud{padding:5px 8px;gap:3px 6px;}
  .stat span{font-size:10px;letter-spacing:1px;}
  .stat b{font-size:14px;}
  .hgroup{gap:8px;}
  .hbtn{font-size:12px;padding:3px 8px;}
  .iconbtn{width:30px;height:28px;}
  .frogs{margin:4px 0 2px;}
  .frogs img{width:40px;}
  .frogs img:nth-child(2){width:28px;}
  .rules{font-size:10px;margin:4px auto 6px;line-height:1.4;}
  .card{padding:12px 14px;}
  .bigbtn{font-size:16px;padding:8px 20px;}
  .dexGrid{grid-template-columns:repeat(4,1fr);gap:6px;}
  .dexCell img{width:48px;height:48px;}
  .introScene{font-size:18px;padding:0 12px;}
  .rareShow .rareImg{width:120px;height:120px;}
  .difficultyBar{gap:4px;}
  .diffBtn{padding:4px 10px;font-size:12px;}
}
</style>
</head>
<body>
<div class="page">
  <div class="hud">
    <div class="hgroup">
      <div class="stat"><span>分数</span><b id="score">$0</b></div>
      <div class="stat"><span>目标</span><b id="target">$800</b></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="btnQuit" class="hbtn" type="button">回工厂</button>
      <button id="btnDexHud" class="hbtn" type="button">奶蛙图鉴</button>
    </div>
    <div class="hgroup">
      <div class="stat" id="timeStat"><span>时间</span><b id="time">45</b></div>
      <div class="stat"><span>关卡</span><b id="level">1</b></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button id="btnPause" class="iconbtn" type="button" title="暂停 / 继续">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></svg>
      </button>
      <button id="btnSound" class="iconbtn" type="button" title="声音开 / 关">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="stage">
    <canvas id="game" width="800" height="600"></canvas>
    <img id="sheetImg" src="assets/laugh-sheet2.webp" alt="" style="display:none" aria-hidden="true">
    <img id="dandanImg" src="assets/dandan-head.webp" alt="" style="display:none" aria-hidden="true">
    <img id="odImg" src="assets/od-boss.webp" alt="" style="display:none" aria-hidden="true">
    <img id="diamondIcon" src="assets/diamond-icon.webp" style="display:none" alt="">
    <img id="odAngryImg" src="assets/od-angry.webp" alt="" style="display:none" aria-hidden="true">
    <div style="display:none" aria-hidden="true">
      <img src="assets/frog-rare-1.webp"><img src="assets/frog-rare-2.webp"><img src="assets/frog-rare-3.webp">
      <img src="assets/frog-rare-4.webp"><img src="assets/frog-rare-5.webp"><img src="assets/frog-rare-6.webp">
      <img src="assets/frog-rare-7.webp"><img src="assets/frog-rare-8.webp"><img src="assets/frog-rare-9.webp"><img src="assets/frog-rare-10.webp"><img src="assets/frog-rare-11.webp"><img src="assets/frog-rare-12.webp"><img src="assets/frog-rare-13.webp"><img src="assets/frog-rare-14.webp"><img src="assets/frog-rare-15.webp"><img src="assets/frog-rare-16.webp"><img src="assets/frog-rare-17.webp"><img src="assets/frog-rare-18.webp"><img src="assets/frog-rare-19.webp"><img src="assets/frog-rare-20.webp"><img src="assets/frog-rare-21.webp"><img src="assets/frog-rare-22.webp"><img src="assets/frog-rare-23.webp"><img src="assets/frog-rare-24.webp"><img src="assets/frog-rare-25.webp"><img src="assets/frog-rare-26.webp"><img src="assets/frog-rare-27.webp"><img src="assets/frog-rare-28.webp"><img src="assets/frog-rare-29.webp"><img src="assets/frog-rare-30.webp"><img src="assets/frog-rare-31.webp"><img src="assets/frog-rare-32.webp"><img src="assets/frog-rare-33.webp"><img src="assets/frog-rare-34.webp"><img src="assets/frog-rare-35.webp"><img src="assets/frog-rare-36.webp"><img src="assets/frog-rare-37.webp"><img src="assets/frog-rare-38.webp"><img src="assets/frog-rare-39.webp"><img src="assets/frog-rare-40.webp"><img src="assets/frog-rare-41.webp"><img src="assets/frog-rare-42.webp"><img src="assets/frog-rare-43.webp"><img src="assets/frog-rare-44.webp"><img src="assets/frog-rare-45.webp"><img src="assets/frog-rare-46.webp"><img src="assets/frog-rare-47.webp">
    </div>
    <audio id="laughAudio" src="assets/laugh-audio.mp3" preload="auto" loop></audio>
    <audio id="bgmAudio" src="assets/bgm.mp3" preload="auto" loop></audio>

    <div id="ovLoading" class="overlay">
      <div class="card">
        <h1 style="font-size:26px;">奶蛙工厂</h1>
        <div class="loadingBox">正在加载<span class="loadingDot"></span><span class="loadingDot"></span><span class="loadingDot"></span></div>
      </div>
    </div>

    <div id="ovFactory" class="factoryScreen hidden">
      <img class="factoryOd" src="assets/od-menu.webp" alt="od厂长">
            <div class="factoryLeft">
        <h1 class="factoryTitle">奶蛙工厂</h1>
        <div id="btnPlay" class="frogBtn" role="button" tabindex="0">
          <img src="assets/frog-small.webp" alt="开始游戏">
          <span class="frogBtnLabel">开始游戏</span>
        </div>
        <div class="factorySub">
          <button id="btnIntro" class="smallbtn" type="button">游戏背景</button>
          <button id="btnDex" class="smallbtn" type="button">奶蛙图鉴</button>
        </div>
        <div class="difficultyBar">
          <button class="diffBtn active" data-diff="easy" type="button">简单</button>
          <button class="diffBtn" data-diff="medium" type="button">中等</button>
          <button class="diffBtn" data-diff="hard" type="button">困难</button>
        </div>
      </div>
    </div>

    <div id="ovIntro" class="introScreen hidden">
      <div id="introContent"></div>
      <div class="introArrow">点击继续 ▶</div>
    </div>

    <div id="ovMenu" class="overlay hidden">
      <div class="card">
        <h1>奶蛙矿工</h1>
        <div class="frogs"><img src="assets/frog-big.webp" alt="大奶蛙"><img src="assets/frog-small.webp" alt="小奶蛙"></div>
        <ul class="rules">
          <li>你是蛋蛋，od厂长的手下，负责抓奶蛙</li>
          <li>每关有一只稀有小奶蛙，抓到可解锁图鉴</li>
          <li>连续空钩会惹od厂长生气</li>
          <li>空格 / 鼠标 / 手指点按 = 放钩，再按一次 = 提前收钩</li>
        </ul>
        <button id="btnStart" class="bigbtn" type="button">开始挖矿</button>
      </div>
    </div>

    <div id="ovPause" class="overlay hidden">
      <div class="card">
        <h1 style="font-size:28px;">暂停中</h1>
        <div class="row"><button id="btnResume" class="smallbtn" type="button">继续游戏</button></div>
      </div>
    </div>

    <div id="ovClear" class="overlay hidden">
      <div class="card">
        <h1 style="font-size:30px;">厂长满意！</h1>
        <p class="sub" id="clearText">本关累计 $0</p>
        <div class="row"><button id="btnNext" class="bigbtn" type="button">下一关</button></div>
      </div>
    </div>

    <div id="ovOver" class="overlay hidden">
      <div class="card">
        <h1 style="font-size:26px;line-height:1.35;">厂长大发雷霆！<br>你输给了狡猾的奶蛙！</h1>
        <div class="laughBox"></div>
        <p class="sub" id="overText">还差 $0 没抓够</p>
        <div class="row">
          <button id="btnRetry" class="smallbtn" type="button">再试一次</button>
          <button id="btnMenu" class="smallbtn" type="button">回工厂</button>
        </div>
      </div>
    </div>

    <div id="ovDex" class="overlay hidden">
      <div class="card" style="max-width:520px;">
        <h1 style="font-size:26px;">奶蛙图鉴</h1>
        <p class="sub" id="dexCount">已收集 0 / 11</p>
        <div class="dexGrid" id="dexGrid"></div>
        <div class="row"><button id="btnDexClose" class="smallbtn" type="button">返回</button></div>
      </div>
    </div>

    <div id="ovRareShow" class="rareShow hidden">
      <img class="rareImg" id="rareShowImg" src="" alt="">
      <div class="rareLabel" id="rareShowLabel"></div>
      <div class="rareTag">稀 有 发 现</div>
    </div>
  </div>

  <p class="hint"><kbd>空格</kbd> / 点击画面 / 手指点按 = 放钩　·　再按一次 = 提前收钩　·　<kbd>P</kbd> 暂停　·　<kbd>M</kbd> 静音</p>
</div>

<script>
'use strict';
var W = 800, H = 600;
var SOIL_TOP = 152;
var PIVOT = { x: 400, y: 128 };
var MINLEN = 54, MAXLEN = 470;
var MAXA = 1.05, FREQ = 0.5;
var DROP_SPEED = 330, RETRACT_EMPTY = 420;
var SPEED = { small: 250, tiny: 285, big: 70, diamond: 330, rock: 90, rare: 260 };
var FONT = "'ZCOOL KuaiLe','Microsoft YaHei','PingFang SC',sans-serif";
var SHEET_W = 144, SHEET_H = 192, SHEET_N = 20;

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

var loadCount = 0, loadNeeded = 12;
function tickLoad(){
  loadCount++;
  if(loadCount >= loadNeeded){
    hide('ovLoading');
    show('ovFactory');
  }
}
// 800ms 兜底：防止图片加载卡住一直转圈
setTimeout(function(){
  hide('ovLoading');
  show('ovFactory');
}, 800);
function loadImg(src){ var im = new Image(); im.onload = tickLoad; im.onerror = tickLoad; im.src = src; return im; }
var RARE = [
  { id:1, name:'呐喊蛙',   img:'assets/frog-rare-1.webp', value:600 },

var SND = {
  ctx: null, muted: false,
  ac: function(){
    if(!this.ctx){ try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
    if(this.ctx && this.ctx.state === 'suspended'){ this.ctx.resume(); }
    try{ startBgm(); }catch(e){}
    return this.ctx;
  },
  tone: function(f, dur, type, vol, delay, slide){
    if(this.muted) return;
    var c = this.ac(); if(!c) return;
    var t = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if(slide){ try{ o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur); }catch(e){} }
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise: function(dur, vol, fc, delay){
    if(this.muted) return;
    var c = this.ac(); if(!c) return;
    var t = c.currentTime + (delay || 0);
    var n = c.createBufferSource(), buf = c.createBuffer(1, Math.max(1, Math.floor(c.sampleRate * dur)), c.sampleRate);
    var d = buf.getChannelData(0);
    for(var i = 0; i < d.length; i++){ d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); }
    n.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc || 400;
    var g = c.createGain(); g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    n.connect(f); f.connect(g); g.connect(c.destination);
    n.start(t);
  },
  drop: function(){ this.noise(0.18, 0.07, 1100); this.tone(330, 0.22, 'sawtooth', 0.05, 0, -200); },
  grab: function(){ this.tone(620, 0.07, 'square', 0.1); this.tone(900, 0.1, 'square', 0.1, 0.06); },
  diamond: function(){ this.tone(1180, 0.09, 'sine', 0.1); this.tone(1570, 0.15, 'sine', 0.08, 0.06); this.tone(2093, 0.2, 'sine', 0.06, 0.12); },
  rock: function(){ this.noise(0.3, 0.28, 160); this.tone(85, 0.26, 'sine', 0.18); },
  coin: function(){ this.tone(880, 0.08, 'square', 0.09); this.tone(1318, 0.17, 'square', 0.09, 0.07); },
  fanfare: function(){ [523, 659, 784, 1046].forEach(function(f, i){ SND.tone(f, 0.16, 'triangle', 0.12, i * 0.14); }); },
  fail: function(){ [392, 330, 262].forEach(function(f, i){ SND.tone(f, 0.2, 'triangle', 0.12, i * 0.16); }); },
  applause: function(){
    for(var i = 0; i < 12; i++){ this.noise(0.08, 0.15, 2000 + Math.random() * 2000, Math.random() * 0.8); }
    for(var j = 0; j < 6; j++){ this.tone(600 + j * 80, 0.15, 'triangle', 0.08, 0.1 + j * 0.08, 200); }
  },
  cheer: function(){
    // 多人"耶——"欢呼声
    for(var k = 0; k < 8; k++){
      var base = 500 + Math.random() * 300;
      this.tone(base, 0.35, 'sawtooth', 0.06, Math.random() * 0.6, 200 + Math.random() * 150);
    }
    // 拉长欢呼
    this.tone(700, 0.6, 'triangle', 0.1, 0.1, 350);
    this.tone(900, 0.6, 'triangle', 0.08, 0.2, 400);
  },
  explosion: function(){ this.noise(1.2, 0.45, 90); this.tone(50, 0.9, 'sine', 0.35, 0, -30); this.noise(0.4, 0.2, 3000, 0.1); }
  , click: function(){ this.tone(1200, 0.06, 'square', 0.08); this.tone(1800, 0.05, 'square', 0.05, 0.04); }
};

function startBgm(){
  if(bgmStarted) return;
  try{
    bgmAudio.muted = SND.muted;
    bgmAudio.volume = 0.25;
    var p = bgmAudio.play();
    if(p && p.then){
      p.then(function(){ bgmStarted = true; }).catch(function(){ bgmStarted = false; });
    } else {
      bgmStarted = true;
    }
  }catch(e){ bgmStarted = false; }
}
function playLaugh(){
  laughAudioOn = true;

    laughAudio.muted = SND.muted;

    if(p && p.catch) p.catch(function(){});

}

  try{ laughAudio.pause(); laughAudio.currentTime = 0; }catch(e){}
}

function rand(a, b){ return a + Math.random() * (b - a); }

function genDeco(){
  G.deco = [];
  for(var i = 0; i < 30; i++){
    G.deco.push({ x: rand(10, W - 10), y: rand(SOIL_TOP + 20, H - 20), r: rand(2, 7),
      c: Math.random() < 0.5 ? 'rgba(255,214,120,0.10)' : 'rgba(30,15,5,0.28)' });
  }
  for(var k = 0; k < 7; k++){
    G.deco.push({ x: rand(60, W - 60), y: rand(SOIL_TOP + 40, H - 60), r: 0, c: 'root',
      len: rand(30, 90), ang: rand(-0.6, 0.6) });
  }
}

function genLevel(n){
  G.items = []; genDeco();
  placeType('small', 2 + Math.min(n, 6));
  placeType('tiny', n >= 4 ? 2 : 1);
  placeType('big', Math.min(1 + Math.ceil(n / 2), 5));
  // 中等/困难：大奶蛙抱钻石左右跑
  if(G.difficulty !== 'easy'){
    G.items.forEach(function(it){
      if(it.type === 'big'){
        it.wander = { dir: Math.random() < 0.5 ? 1 : -1, range: 80, cx: it.x, speed: rand(30, 85) };
        it.holdsDiamond = true;
        it.value += 400; // 抱钻石加分
      }
    });
  }
  placeType('diamond', n >= 2 ? 2 : 1);
  placeType('rock', 2 + Math.ceil(n / 1.5));
  var dex = loadDex();
  var ungot = RARE.filter(function(r){ return dex.indexOf(r.id) < 0; });
  var chosen = ungot.length ? ungot[Math.floor(Math.random() * ungot.length)] : RARE[Math.floor(Math.random() * RARE.length)];
  for(var rt = 0; rt < 400; rt++){
    var ra = rand(-0.95, 0.95) * MAXA;
    var rcosA = Math.max(0.52, Math.cos(ra));
    var rlenMax = Math.min(MAXLEN - 24, (H - 46 - PIVOT.y) / rcosA);
    if(rlenMax < 150) rlenMax = 150;
    var rlen = rand(160, rlenMax);
    var rx = PIVOT.x + Math.sin(ra) * rlen;
    var ry = PIVOT.y + rcosA * rlen;
    if(ry < SOIL_TOP + 85) continue;
    var rok = true;
    for(var ri = 0; ri < G.items.length; ri++){
      var rit = G.items[ri];
      if(Math.hypot(rit.x - rx, rit.y - ry) < rit.r + 36 + 14){ rok = false; break; }
    }
    if(rok){
      G.items.push({ type:'rare', rareId: chosen.id, rareName: chosen.name, x:rx, y:ry, r:36, w:72, h:80, value: chosen.value, grabbed:false, collected:false });
      break;
    }
  }
  var total = 0;
  G.items.forEach(function(it){ total += it.value; });
  G.target = Math.max(500, Math.round(total * 0.62 / 50) * 50);
  G.time = G.timeMax = 45;
  G.missCount = 0;
  updateHUD();
}

function placeType(type, count){
  for(var k = 0; k < count; k++){
    for(var tries = 0; tries < 400; tries++){
      var a;
      if(type === 'diamond'){
        var side = Math.random() < 0.5 ? -1 : 1;
        a = side * rand(0.62, 0.98) * MAXA;
      } else {
        a = rand(-0.95, 0.95) * MAXA;
      }
      var cosA = Math.max(0.52, Math.cos(a));
      var lenMax = Math.min(MAXLEN - 24, (H - 46 - PIVOT.y) / cosA);
      if(lenMax < 150) lenMax = 150;
      var len = type === 'diamond' ? rand(lenMax * 0.82, lenMax * 0.98) : rand(160, lenMax);
      var x = PIVOT.x + Math.sin(a) * len;
      var y = PIVOT.y + cosA * len;
      if(y < SOIL_TOP + 85) continue;
      var cfg = ITEMCFG[type];
      var ok = true;
      for(var j = 0; j < G.items.length; j++){
        var it = G.items[j];
        if(Math.hypot(it.x - x, it.y - y) < it.r + cfg.r + 14){ ok = false; break; }
      }
      if(ok){
        var it = { type: type, x: x, y: y, r: cfg.r, w: cfg.w, h: cfg.h, value: cfg.value(), grabbed: false, collected: false };
        if(type === 'rock'){ var o = []; for(var m = 0; m < 7; m++){ o.push(0.72 + Math.random() * 0.28); } it.offs = o; }
        G.items.push(it); break;
      }
    }
  }
}

function pop(x, y, txt, size, color){
  G.fx.push({ x: x, y: y, txt: txt, size: size || 20, color: color || '#ffe14d', vy: -44, life: 1.1, max: 1.1, rot: rand(-0.12, 0.12) });
}
function burst(x, y, n, colors, spd, grav, sz, life){
  for(var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2, v = rand(spd * 0.4, spd);
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, g: grav || 260, life: life || 0.7, max: life || 0.7, size: rand(sz * 0.6, sz), color: colors[Math.floor(Math.random() * colors.length)] });
  }
}
function sparkle(x, y){ burst(x, y, 22, ['#ffe14d', '#ffd75e', '#fff6c9', '#f5a623'], 190, 120, 5, 0.7); }
function confetti(x, y){ burst(x, y, 34, ['#ffe14d', '#ff9d3d', '#58a84f', '#ff6b5e', '#6ec6ff'], 230, 260, 5, 1.0); }
function dust(x, y){ burst(x, y, 14, ['#a0835c', '#8a6b45', '#6b4f2e'], 110, 40, 6, 0.8); }
function diamondBurst(x, y){
  burst(x, y, 40, ['#ffffff', '#c8f0ff', '#5db4ec', '#ffe14d'], 260, 100, 4, 1.0);
  for(var i = 0; i < 8; i++){
    G.fx.push({ x: x, y: y, txt: '✦', size: 18 + Math.random() * 14, color: '#fff', vy: -30 - Math.random() * 40, life: 1.2, max: 1.2, rot: rand(-0.3, 0.3) });
  }
}

function updateFx(dt){
  for(var i = G.fx.length - 1; i >= 0; i--){
    var f = G.fx[i]; f.life -= dt; f.y += f.vy * dt; f.vy *= (1 - 1.4 * dt);
    if(f.life <= 0) G.fx.splice(i, 1);
  }
  for(var j = G.parts.length - 1; j >= 0; j--){
    var p = G.parts[j]; p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if(p.life <= 0) G.parts.splice(j, 1);
  }
  for(var k = G.laughs.length - 1; k >= 0; k--){
    var l = G.laughs[k]; l.life -= dt;
    if(l.life <= 0) G.laughs.splice(k, 1);
  }
}

function tip(){
  var c = G.claw;
  return { x: PIVOT.x + Math.sin(c.angle) * c.len, y: PIVOT.y + Math.cos(c.angle) * c.len };
}
function swingOnly(dt){
  var c = G.claw;
  c.phase += dt * Math.PI * 2 * FREQ;
  c.angle = MAXA * Math.sin(c.phase);
  c.len = MINLEN;
}
function updateClaw(dt){
  var c = G.claw;
  if(c.st === 'swing'){ swingOnly(dt); }
  else if(c.st === 'drop'){
    c.len += DROP_SPEED * dt;
    if(c.len >= MAXLEN){ c.st = 'retract'; c.item = null; onMiss(); return; }
    var t = tip();
    var best = null, bestD = 1e9;
    for(var i = 0; i < G.items.length; i++){
      var it = G.items[i];
      if(it.collected || it.grabbed) continue;
      var d = Math.hypot(t.x - it.x, t.y - it.y);
      if(d < it.r + 12 && d < bestD){ bestD = d; best = it; }
    }
    if(best) grab(best);
  } else if(c.st === 'retract'){
    var sp = c.item ? SPEED[c.item.type] : RETRACT_EMPTY;
    var bigPull = !!(c.item && c.item.type === 'big');
    if(bigPull){
      var ph = (performance.now() % 800) / 800;
      if(ph > 0.4) sp *= 0.05;
      if(Math.random() < dt * 4){
        var tp0 = tip();
        G.parts.push({ x: tp0.x + rand(-7, 7), y: tp0.y + 10, vx: rand(-15, 15), vy: rand(-90, -40), g: 280, life: 0.45, max: 0.45, size: 3, color: '#d8f6ff' });
      }
    }
    c.len -= sp * dt;
    if(c.item){ var tp = tip(); c.item.x = tp.x; c.item.y = tp.y; }
    if(c.len <= MINLEN){ deliver(); c.st = 'swing'; c.item = null; }
  }
}

var ANGRY_QUOTES = ['没用的蛋蛋！', '蛋蛋你怎么又空钩了！', '蛋蛋你今天不许吃晚饭！'];
function onMiss(){
  G.missCount++;
  G.odAngry = 1.2; // 每次空钩都冒火一下
  if(G.missCount >= 3){
    G.missCount = 0;
    startAngryCutscene();
  }
}
function startAngryCutscene(){
  if(G.state !== 'play') return;
  G.state = 'angryPause';
  G.odAngry = 3;
  var quote = ANGRY_QUOTES[Math.floor(Math.random() * ANGRY_QUOTES.length)];
  G.angryState = {
    timer: 0,
    quote: quote,
    bullet: { x: G.planeX, y: G.planeY + 15, vx: 0, vy: 0, hit: false }
  };
  SND.fail();
  // 子弹朝蛋蛋脸飞
  var bx = G.dandanX - G.planeX;
  var by = (G.dandanY - 20) - (G.planeY + 15);
  var bt = 1.0; // 1秒飞完
  G.angryState.bullet.vx = bx / bt;
  G.angryState.bullet.vy = by / bt;
}

function grab(it){
  var c = G.claw;
  it.grabbed = true; c.item = it; c.st = 'retract';
  G.dandanJump = 0.5; // 高兴连跳两下
  if(it.type === 'big'){
    G.laughClock = 0.0001; G.shake = 0.5; playLaugh();
    pop(it.x, it.y - 60, '好重！哈哈哈哈！', 24, '#ffe14d');
    sparkle(it.x, it.y);
  } else if(it.type === 'rock'){
    SND.rock(); dust(it.x, it.y);
    pop(it.x, it.y - 30, '好沉…', 16, '#cfc4ae');
    G.missCount++;
    if(G.missCount >= 3){ G.odAngry = 2.5; G.missCount = 0; pop(400, 60, '厂长生气了！', 22, '#ff6b5e'); }
  } else if(it.type === 'diamond'){
    SND.diamond(); diamondBurst(it.x, it.y);
    pop(it.x, it.y - 30, '钻石！', 22, '#c8f0ff');
  } else if(it.type === 'rare'){
    SND.diamond(); sparkle(it.x, it.y);
    showRareShow(it);
  } else {
    SND.grab(); G.missCount = 0;
  }
}

function deliver(){
  var it = G.claw.item;
  if(!it) return;
  if(it.type === 'rock'){
    dust(PIVOT.x, PIVOT.y + 40, 12);
    pop(PIVOT.x, PIVOT.y - 36, '石头搬上来了', 15, '#cfc4ae');
  } else {
    G.score += it.value;
    SND.coin();
    pop(400, 108, '+' + it.value, 27, '#ffe14d');
    if(it.type === 'big'){
      G.shake = Math.max(G.shake, 0.3);
      pop(400, 148, '好重…终于收工！', 20, '#ff9d3d');
      confetti(400, 170); stopLaugh();
    }
    if(it.type === 'rare'){
      var dex = loadDex();
      var isNew = dex.indexOf(it.rareId) < 0;
      if(isNew){ dex.push(it.rareId); saveDex(dex); }
      pop(400, 148, isNew ? '图鉴解锁：' + it.rareName : '又是' + it.rareName, 20, '#ffd75e');
      confetti(400, 170);
    }
    if(it.type === 'diamond'){ diamondBurst(400, 170); }

  it.collected = true;

}

function showRareShow(it){

function hideRareShow(){

}

function dropBomb(){
  var dx = G.dandanX - G.planeX;
  var dy = (G.dandanY + 10) - (G.planeY + 20);
  var t = Math.max(0.8, Math.sqrt(2 * dy / 600)); // 自由落体时间
  G.bomb = { x: G.planeX, y: G.planeY + 20, vy: 0, vx: dx / t, exploded: false, tx: G.dandanX, ty: G.dandanY + 10 };
}
function updateBomb(dt){
  if(!G.bomb) return;
  if(!G.bomb.exploded){
    G.bomb.vy += 600 * dt;
    G.bomb.y += G.bomb.vy * dt;
    G.bomb.x += G.bomb.vx * dt;
    // 拖尾
    G.parts.push({ x: G.bomb.x, y: G.bomb.y, vx: 0, vy: 0, g: 0, life: 0.3, max: 0.3, size: 3, color: '#666' });
    if(G.bomb.y >= G.bomb.ty){
      G.bomb.exploded = true;
      G.shake = 1.2;
      G.dandanFaceDead = true;
      SND.explosion();
      burst(G.dandanX, G.dandanY, 60, ['#ff6b3a', '#ffd75e', '#333', '#666', '#999', '#fff'], 320, 220, 7, 1.8);
      // 火球
      for(var fi = 0; fi < 5; fi++){
        G.fx.push({ x: G.dandanX + (Math.random()-0.5)*40, y: G.dandanY + (Math.random()-0.5)*20,
          txt: ['🔥','●','✦'][fi % 3], size: 28 + Math.random()*18, color: fi%2 ? '#ff9d3d' : '#ffe14d',
          vy: -20 - Math.random()*30, life: 1.4, max: 1.4, rot: rand(-0.2,0.2) });
      }
      pop(G.dandanX, G.dandanY - 50, '轰——！', 38, '#ff9d3d');
      setTimeout(function(){ G.bomb = null; }, 1500);
    }
  }
}
function updateWander(dt){
  if(G.state !== 'play') return;
  G.items.forEach(function(it){
    if(it.wander && !it.grabbed){
      it.x += it.wander.dir * it.wander.speed * dt;
      if(it.x > it.wander.cx + it.wander.range){ it.wander.dir = -1; }
      if(it.x < it.wander.cx - it.wander.range){ it.wander.dir = 1; }
    }
  });
}
function updatePivot(dt){
  if(G.difficulty !== 'hard' || G.state !== 'play') return;
  G.pivotT += dt * 0.6;
  PIVOT.x = 400 + Math.sin(G.pivotT) * 80;
  G.dandanX = PIVOT.x - 25;
}
function updateAngry(dt){
  if(!G.angryState) return;
  var a = G.angryState;
  a.timer += dt;
  // 子弹飞
  if(!a.bullet.hit){
    a.bullet.x += a.bullet.vx * dt;
    a.bullet.y += a.bullet.vy * dt;
    var dx = a.bullet.x - G.dandanX;
    var dy = a.bullet.y - (G.dandanY - 20);
    if(Math.hypot(dx, dy) < 12){
      a.bullet.hit = true;
      G.dandanFaceDead = true;
      G.shake = 0.6;
      SND.explosion();
      burst(G.dandanX, G.dandanY - 20, 24, ['#ff6b3a', '#333', '#666', '#999'], 220, 180, 5, 1.0);
      // 1.2 秒后脸自动恢复
      setTimeout(function(){ G.dandanFaceDead = false; }, 1200);
    }
  }
  // 3秒后结束
  if(a.timer >= 3.0){
    G.angryState = null;
    G.state = 'play';
    // 脸黑保留到下次抓到东西
  }
}

}

function update(dt){
  G.shake = Math.max(0, G.shake - dt);
  if(G.laughClock > 0) G.laughClock += dt;
  updateFx(dt);
  updateBomb(dt);
  updateWander(dt);
  updatePivot(dt);
  updateAngry(dt);
  if(G.state === 'rareShow'){
    G.rareShowTimer -= dt;
    if(G.rareShowTimer <= 0) hideRareShow();
    return;
  }
  if(G.scene === 'play' && G.state === 'play'){
    G.planeX += G.planeDir * 60 * dt;
    if(G.planeX > W - 80){ G.planeX = W - 80; G.planeDir = -1; }
    if(G.planeX < 80){ G.planeX = 80; G.planeDir = 1; }
    if(G.odAngry > 0) G.odAngry -= dt;
    if(G.dandanJump > 0) G.dandanJump -= dt;
  }
  if(G.state === 'menu'){ swingOnly(dt); return; }
  if(G.state !== 'play') return;
  G.time -= dt;
  updateClaw(dt);
  if(laughAudioOn && !(G.claw.item && G.claw.item.type === 'big')) stopLaugh();
  if(G.time <= 0 && G.score < G.target){ gameOver(); }
  updateHUD();
}

function drawText(txt, x, y, size, color, stroke){
  ctx.font = size + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(2, size / 9);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = stroke || 'rgba(0,0,0,0.55)';
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBg(){
  var sky = ctx.createLinearGradient(0, 0, 0, 152);
  sky.addColorStop(0, '#a9dcff'); sky.addColorStop(1, '#e7f6ff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 152);
  ctx.fillStyle = '#58a84f'; ctx.fillRect(0, 132, W, 24);
  ctx.fillStyle = '#3f8038'; ctx.fillRect(0, 150, W, 8);
  var soil = ctx.createLinearGradient(0, 158, 0, H);
  soil.addColorStop(0, '#8a5a2b'); soil.addColorStop(0.5, '#7a4a21'); soil.addColorStop(1, '#4d2f14');
  ctx.fillStyle = soil; ctx.fillRect(0, 158, W, H - 158);
  for(var i = 0; i < G.deco.length; i++){
    var d = G.deco[i];
    if(d.c === 'root'){
      ctx.strokeStyle = 'rgba(40,22,8,0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(d.x, d.y);
      ctx.quadraticCurveTo(d.x + Math.cos(d.ang) * d.len * 0.5, d.y - 10, d.x + Math.cos(d.ang) * d.len, d.y - 18);
      ctx.stroke();
    } else {
      ctx.fillStyle = d.c;
      ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawHouse(){
  var hx = 490; // 房子固定不动
  ctx.fillStyle = '#8a4b22';
  ctx.beginPath(); ctx.moveTo(hx - 72, 66); ctx.lineTo(hx + 72, 66); ctx.lineTo(hx, 38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#a05c2a';
  ctx.beginPath(); ctx.moveTo(hx - 72, 66); ctx.lineTo(hx + 72, 66); ctx.lineTo(hx, 44); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6b4226';
  roundRect(hx - 58, 66, 116, 64, 6); ctx.fill();
  ctx.fillStyle = '#57321a';
  roundRect(hx - 58, 66, 116, 12, 6); ctx.fill();
  ctx.fillStyle = '#ffe9a0';
  roundRect(hx - 20, 80, 40, 28, 5); ctx.fill();
  ctx.strokeStyle = '#57321a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx, 80); ctx.lineTo(hx, 108); ctx.moveTo(hx - 20, 94); ctx.lineTo(hx + 20, 94); ctx.stroke();
  ctx.fillStyle = '#3a2410';
  ctx.beginPath(); ctx.arc(PIVOT.x, PIVOT.y + 3, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#caa44e';
  ctx.beginPath(); ctx.arc(PIVOT.x, PIVOT.y + 3, 4, 0, Math.PI * 2); ctx.fill();
}

function drawDandan(){
  var x = G.dandanX, y = G.dandanY;
  // 高兴连跳两下：0.5 秒内两个抛物线
  if(G.dandanJump > 0){
    var jp = 1 - G.dandanJump / 0.5; // 0..1
    var jump = Math.abs(Math.sin(jp * Math.PI * 2)) * -12;
    y += jump;
  }
  ctx.save();
  // 身体始终原色，永远不黑
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, y + 14);
  ctx.moveTo(x - 14, y + 6);
  ctx.lineTo(x, y + 8);
  ctx.lineTo(x + 14, y + 6);
  ctx.moveTo(x, y + 14);
  ctx.lineTo(x - 8, y + 26);
  ctx.moveTo(x, y + 14);
  ctx.lineTo(x + 8, y + 26);
  ctx.stroke();
  var headSize = 36;
  var headCy = y - 20;
  if(IMG.dandan && IMG.dandan.complete && IMG.dandan.naturalWidth > 0){
    ctx.drawImage(IMG.dandan, x - headSize/2, headCy - headSize/2, headSize, headSize);
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, headCy, headSize/2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.stroke();
  }
  if(G.dandanFaceDead){
    ctx.fillStyle = 'rgba(20,20,20,0.82)';
    ctx.beginPath(); ctx.arc(x, headCy, headSize/2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawOdPlane(){
  if(G.scene !== 'play') return;
  var x = G.planeX, y = G.planeY;
  var angry = G.odAngry > 0;
  ctx.save();
  // 飞机阴影
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x, y + 14, 32, 4, 0, 0, Math.PI * 2); ctx.fill();
  // 机身（白色椭圆）
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#9ab8d6'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y, 34, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // 座舱
  ctx.fillStyle = '#cfe6ff';
  ctx.beginPath(); ctx.ellipse(x - 6, y - 4, 14, 7, 0, 0, Math.PI * 2); ctx.fill();
  // 机翼
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#9ab8d6'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 18, y - 2); ctx.lineTo(x - 10, y - 22); ctx.lineTo(x + 6, y - 22); ctx.lineTo(x + 12, y - 2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 尾翼
  ctx.beginPath();
  ctx.moveTo(x + 24, y - 4); ctx.lineTo(x + 32, y - 16); ctx.lineTo(x + 38, y - 4);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 螺旋桨
  ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 34, y); ctx.lineTo(x - 42, y); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x - 42, y, 2, 8, 0, 0, Math.PI * 2); ctx.fillStyle = '#888'; ctx.fill();
  // od 只露上半身（从源图裁上半部分）
  if(IMG.od && IMG.od.complete && IMG.od.naturalWidth > 0){
    var ow = IMG.od.naturalWidth, oh = IMG.od.naturalHeight;
    // 源图上半部分（头+肩）
    var srcH = oh * 0.45;
    var dw = 30, dh = dw * srcH / ow;
    ctx.drawImage(IMG.od, 0, 0, ow, srcH, x - dw/2, y - dh - 2, dw, dh);
  }
  if(angry){
    ctx.fillStyle = '#ff6b3a';
    ctx.beginPath(); ctx.arc(x - 6, y - 40, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 2, y - 44, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 8, y - 38, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd75e';
    ctx.beginPath(); ctx.arc(x + 2, y - 44, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBomb(){
  if(!G.bomb || G.bomb.exploded) return;
  ctx.save();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(G.bomb.x, G.bomb.y, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#666';
  ctx.beginPath(); ctx.arc(G.bomb.x - 3, G.bomb.y - 3, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function roundRectPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function drawAngryCutscene(){
  if(!G.angryState) return;
  var a = G.angryState;
  // od：占右下角一大半，到腰部，保持比例不拉伸
  var odW = 340;
  var srcHratio = 0.72; // 裁到腰部
  var natW = IMG.angry ? IMG.angry.naturalWidth : 1664;
  var natH = IMG.angry ? IMG.angry.naturalHeight : 2368;
  var srcH = natH * srcHratio;
  var odH = odW * (srcH / natW); // 保持比例
  var targetX = W - odW - 0, odY = H - odH;
  var slideT = Math.min(a.timer / 0.35, 1);
  var ease = 1 - Math.pow(1 - slideT, 3);
  var odX = W + 30 - (W + 30 - targetX) * ease;
  var swing = Math.sin(a.timer * 14) * 0.08;
  ctx.save();
  ctx.translate(odX + odW/2, odY + odH * 0.5);
  ctx.rotate(swing);
  ctx.translate(-(odX + odW/2), -(odY + odH * 0.5));
  if(IMG.angry && IMG.angry.complete && IMG.angry.naturalWidth > 0){
    ctx.drawImage(IMG.angry, 0, 0, natW, srcH, odX, odY, odW, odH);
  }
  ctx.restore();
  // 对话框：移到底部居中，黄色圆角按钮形状（和图二一致）
  var bw = 280, bh = 56;
  var bx = (W - bw) / 2, by = H - bh - 8;
  ctx.fillStyle = '#ffd75e';
  ctx.strokeStyle = '#a06810';
  ctx.lineWidth = 3;
  roundRectPath(bx, by, bw, bh, 14);
  ctx.fill(); ctx.stroke();
  // 打字机效果
  var chars = Math.min(a.quote.length, Math.floor((a.timer - 0.35) * 12));
  if(chars > 0){
    ctx.fillStyle = '#4a2c0f';
    ctx.font = 'bold 18px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(a.quote.substring(0, chars), bx + bw/2, by + bh/2);
  }
  // 子弹
  if(!a.bullet.hit){
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(a.bullet.x, a.bullet.y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff6b3a';
    ctx.beginPath(); ctx.arc(a.bullet.x - 2, a.bullet.y - 2, 2, 0, Math.PI * 2); ctx.fill();
  }
}

function drawChain(){
  var c = G.claw, t = tip();
  if(c.item && c.item.type === 'big' && c.st === 'retract'){
    t.x += (Math.random() - 0.5) * 3.2; t.y += (Math.random() - 0.5) * 3.2;
  }
  ctx.strokeStyle = '#caa44e'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(PIVOT.x, PIVOT.y + 4); ctx.lineTo(t.x, t.y); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PIVOT.x + 1.5, PIVOT.y + 4); ctx.lineTo(t.x + 1.5, t.y); ctx.stroke();
  ctx.save();
  ctx.translate(t.x, t.y); ctx.rotate(c.angle);
  ctx.fillStyle = '#43331f';
  ctx.fillRect(-6, 0, 12, 10);
  var spread = c.item ? 0.1 : 0.5;
  ctx.strokeStyle = '#6b5a33'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(-5, 10);
  ctx.quadraticCurveTo(-5 - 8 * spread, 17, -2 - 7 * spread, 26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5, 10);
  ctx.quadraticCurveTo(5 + 8 * spread, 17, 2 + 7 * spread, 26); ctx.stroke();
  ctx.restore();
}

function drawShadow(x, y, w, h){
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.beginPath(); ctx.ellipse(x, y + h * 0.47, w * 0.44, h * 0.11, 0, 0, Math.PI * 2); ctx.fill();
}

function drawDiamond(x, y, s, t){
  ctx.save(); ctx.translate(x, y);
  var tw = 0.65 + 0.35 * Math.sin(t * 4.2);
  ctx.globalAlpha = tw;
  var h = s, w = s;
  var g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#c8f0ff'); g.addColorStop(0.7, '#5db4ec'); g.addColorStop(1, '#1f6bd0');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -h / 2);
  ctx.lineTo(w * 0.4, -h * 0.42);
  ctx.lineTo(w / 2, h * 0.05);
  ctx.lineTo(0, h / 2);
  ctx.lineTo(-w / 2, h * 0.05);
  ctx.lineTo(-w * 0.4, -h * 0.42);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(0, -h / 2);
  ctx.lineTo(w * 0.4, -h * 0.42);
  ctx.lineTo(0, -h * 0.34);
  ctx.lineTo(-w * 0.4, -h * 0.42);
  ctx.closePath(); ctx.fill();
  var fl = (0.5 + 0.5 * Math.sin(t * 5)) * s * 0.42;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-fl, 0); ctx.lineTo(fl, 0);
  ctx.moveTo(0, -fl * 1.2); ctx.lineTo(0, fl * 0.8);
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-w * 0.15, -h * 0.1, s * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawRock(x, y, w, h, off){
  var pts = 7;
  if(!off || off.length < pts){ off = [0.9, 0.85, 0.95, 0.88, 0.92, 0.84, 0.9]; }
  ctx.save(); ctx.translate(x, y);
  var g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  g.addColorStop(0, '#9a9186'); g.addColorStop(1, '#6f675c');
  ctx.fillStyle = g;
  ctx.beginPath();
  for(var j = 0; j < pts; j++){
    var a = (j / pts) * Math.PI * 2;
    var px = Math.cos(a) * w / 2 * off[j], py = Math.sin(a) * h / 2 * off[j];
    if(j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(40,32,22,0.5)'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = 'rgba(40,32,22,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-w * 0.16, -h * 0.22); ctx.lineTo(-w * 0.03, h * 0.06); ctx.lineTo(-w * 0.18, h * 0.24); ctx.stroke();
  ctx.restore();
}

function drawLaughFrame(x, y, scale, clock){
  var fr = Math.floor(clock / 0.09) % SHEET_N;
  var w = SHEET_W * scale, h = SHEET_H * scale;
  ctx.drawImage(IMG.sheet, fr * SHEET_W, 0, SHEET_W, SHEET_H, x - w / 2, y - h / 2, w, h);
}

function drawItems(t){
  for(var i = 0; i < G.items.length; i++){
    var it = G.items[i];
    if(it.collected) continue;
    var attached = it.grabbed;
    if(it.type !== 'rare') drawShadow(it.x, it.y, it.w, it.h);
    if(it.type === 'big'){
      if(attached){
        var shrink = 1, lift = 0;
        if(G.claw.st === 'retract'){
          var l = G.claw.len;
          shrink = Math.max(0.06, (l - MINLEN) / 140);
          lift = (1 - shrink) * 55;
        }
        drawLaughFrame(it.x, it.y - 10 - lift, (it.h * 1.5 * shrink) / SHEET_H, G.laughClock);
      } else {
        // wander 时根据方向镜像翻转
        if(it.wander && it.wander.dir < 0){
          ctx.save();
          ctx.translate(it.x, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(IMG.big, -it.w/2, it.y - it.h/2, it.w, it.h);
          ctx.restore();
        } else {
          ctx.drawImage(IMG.big, it.x - it.w / 2, it.y - it.h / 2, it.w, it.h);
        }
      }
    } else if(it.type === 'small' || it.type === 'tiny'){
      var scale = it.type === 'tiny' ? 0.72 : 1;
      ctx.drawImage(IMG.small, it.x - it.w * scale / 2, it.y - it.h * scale / 2, it.w * scale, it.h * scale);
    } else if(it.type === 'rare'){
      var rim = IMG.rare[it.rareId];
      var rh = it.h;
      var rw = rim && rim.naturalWidth ? rh * rim.naturalWidth / rim.naturalHeight : rh * 0.9;
      // 发光光晕
      var glowR = rh * 0.9;
      var glow = ctx.createRadialGradient(it.x, it.y, 0, it.x, it.y, glowR);
      glow.addColorStop(0, 'rgba(255,225,77,0.55)');
      glow.addColorStop(0.5, 'rgba(255,157,61,0.25)');
      glow.addColorStop(1, 'rgba(255,157,61,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(it.x, it.y, glowR, 0, Math.PI*2); ctx.fill();
      // 旋转光束（6条）
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(t * 1.5);
      for(var ri = 0; ri < 6; ri++){
        ctx.rotate(Math.PI / 3);
        var rayGrad = ctx.createLinearGradient(0, 0, glowR, 0);
        rayGrad.addColorStop(0, 'rgba(255,240,150,0.6)');
        rayGrad.addColorStop(1, 'rgba(255,240,150,0)');
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.lineTo(glowR, -1);
        ctx.lineTo(glowR, 1);
        ctx.lineTo(0, 4);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.ellipse(it.x, it.y + rh * 0.46, rw * 0.4, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.drawImage(rim, it.x - rw / 2, it.y - rh / 2, rw, rh);
    } else if(it.type === 'diamond'){
      drawDiamond(it.x, it.y, it.w, t);
    } else if(it.type === 'rock'){
      drawRock(it.x, it.y, it.w, it.h, it.offs);
    }
  }
}

function drawLaughBursts(){
  for(var i = 0; i < G.laughs.length; i++){
    var l = G.laughs[i];
    var s = l.scale * (0.75 + 0.25 * (l.life / 3.0));
    drawLaughFrame(l.x, l.y, s, performance.now() / 1000);
  }
}

function drawFx(){
  for(var i = 0; i < G.fx.length; i++){
    var f = G.fx[i];
    var a = Math.max(0, f.life / f.max);
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    drawText(f.txt, 0, 0, f.size, f.color);
    ctx.restore();
  }
  for(var j = 0; j < G.parts.length; j++){
    var p = G.parts[j];
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function draw(){
  ctx.save();
  if(G.shake > 0){
    ctx.translate((Math.random() - 0.5) * G.shake * 16, (Math.random() - 0.5) * G.shake * 16);
  }
  drawBg();
  drawItems(performance.now() / 1000);
  drawChain();
  drawHouse();
  drawDandan();
  drawOdPlane();
  drawBomb();
  drawAngryCutscene();
  drawLaughBursts();
  drawFx();
  ctx.restore();
}

canvas.addEventListener('pointerdown', function(e){
  e.preventDefault(); SND.ac(); startBgm(); dropOrRetract();
});
document.addEventListener('keydown', function(e){
  if(e.code === 'Space' || e.code === 'ArrowDown'){ e.preventDefault(); SND.ac(); startBgm(); dropOrRetract(); }
  else if(e.key === 'p' || e.key === 'P'){ togglePause(); }
  else if(e.key === 'm' || e.key === 'M'){ toggleSound(); }
});
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

var INTRO_SCENES = [
  { img: 'assets/frog-small.webp',  text: '从前，奶蛙和人类和平共处，快乐地生活在森林里……' },
  { img: 'assets/od-boss.webp',     text: '但邪恶的od厂长发现，奶蛙做成的黄桃罐头异常美味！' },
  { img: 'assets/frog-big.webp',    text: '他开始在各地搜捕奶蛙，把它们抓进工厂……' },
  { img: 'assets/dandan-head.webp', text: '他的手下蛋蛋，正在帮他抓捕奶蛙。而你——就是蛋蛋！' },
  { img: 'assets/frog-rare-5.webp', text: '抓齐所有稀有奶蛙，成为od厂长最得力的助手！' }
];
var introIdx = 0;
function startIntro(){ introIdx = 0; show('ovIntro'); showIntroScene(); }
function showIntroScene(){
  var s = INTRO_SCENES[introIdx];
  document.getElementById('introContent').innerHTML = '<img class="introImg" src="' + s.img + '"><div class="introScene">' + s.text + '</div>';
}
function nextIntro(){ SND.ac(); SND.click(); introIdx++; if(introIdx >= INTRO_SCENES.length){ hide('ovIntro'); } else { showIntroScene(); } }
document.getElementById('ovIntro').addEventListener('click', nextIntro);

var dexPrevState = 'menu';
function showDex(){
  dexPrevState = G.state;
  if(G.state === 'play'){ G.state = 'dex'; try{ laughAudio.pause(); }catch(e){} }
  var dex = loadDex();
  var cells = [
    { name:'小奶蛙', src:'assets/frog-small.webp', owned:true },
    { name:'大奶蛙', src:'assets/frog-big.webp',   owned:true }
  ];
  RARE.forEach(function(r){
    var owned = dex.indexOf(r.id) >= 0;
    cells.push({ name: owned ? r.name : '???', src: r.img, owned: owned });
  });
  var grid = $('dexGrid');
  grid.innerHTML = '';
  cells.forEach(function(c){
    var cell = document.createElement('div');
    cell.className = 'dexCell' + (c.owned ? '' : ' locked');
    var im = document.createElement('img');
    im.src = c.owned ? c.src : 'assets/frog-small.webp';
    im.alt = c.name;
    if(!c.owned) im.style.filter = 'brightness(0) opacity(0.3)'
    var nm = document.createElement('div');
    nm.className = 'nm'; nm.textContent = c.name;
    cell.appendChild(im); cell.appendChild(nm);
    grid.appendChild(cell);
  });
  var ownedCount = cells.filter(function(c){ return c.owned; }).length;
  $('dexCount').textContent = '已收集 ' + ownedCount + ' / ' + cells.length;
  show('ovDex');
}
function closeDex(){
  SND.ac(); SND.click();
  hide('ovDex');
  if(dexPrevState === 'play'){
    G.state = 'play';
    if(laughAudioOn){ try{ var p = laughAudio.play(); if(p && p.catch) p.catch(function(){}); }catch(e){} }
  }
}

function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

document.querySelectorAll('.diffBtn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.diffBtn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    G.difficulty = btn.dataset.diff;
    SND.click();
  });
});
$('btnIntro').addEventListener('click', function(){ SND.ac(); SND.click(); startIntro(); });
$('btnPlay').addEventListener('click', function(){ SND.ac(); SND.click(); startGame(); });
$('btnStart').addEventListener('click', function(){ SND.ac(); SND.click(); enterMiner(); });
$('btnDex').addEventListener('click', function(){ SND.ac(); SND.click(); showDex(); });
$('btnDexHud').addEventListener('click', function(){ SND.ac(); SND.click(); showDex(); });
$('btnDexClose').addEventListener('click', closeDex);
$('btnQuit').addEventListener('click', toFactory);
$('btnPause').addEventListener('click', togglePause);
$('btnSound').addEventListener('click', toggleSound);
$('btnResume').addEventListener('click', togglePause);
$('btnNext').addEventListener('click', nextLevel);
$('btnRetry').addEventListener('click', retryLevel);
$('btnMenu').addEventListener('click', toFactory);

genLevel(1);
resetClaw();
updateHUD();

var last = performance.now();
function loop(now){
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
